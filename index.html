<html lang="fa" dir="rtl" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OceanLedger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d5c63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OceanLedger">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef3f1;--card:#fff;--tx:#12303a;--mu:#5d7780;--pr:#0d5c63;--pt:#fff;--ac:#e0562b;--bd:#cddbd8;--ok:#1b7f4b;--bad:#c23a2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a1f;--card:#12292f;--tx:#e4f0ee;--mu:#8fadaa;--pr:#4cc0c0;--pt:#062024;--ac:#ff8a5c;--bd:#26434a;--ok:#4cc27f;--bad:#ef7a6c}}
:root[data-theme="dark"]{--bg:#0a1a1f;--card:#12292f;--tx:#e4f0ee;--mu:#8fadaa;--pr:#4cc0c0;--pt:#062024;--ac:#ff8a5c;--bd:#26434a;--ok:#4cc27f;--bad:#ef7a6c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",Tahoma,system-ui,sans-serif}
header{background:var(--pr);color:var(--pt);padding:10px 14px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{margin:0 0 6px;font-size:20px;letter-spacing:.3px}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{flex:1;background:none;border:0;color:inherit;padding:9px 6px;opacity:.75;border-bottom:3px solid transparent;border-radius:0;font-weight:600}
nav button.on{opacity:1;border-color:var(--ac)}
main{max-width:760px;margin:0 auto;padding:12px}
h3{margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0}
.tap{cursor:pointer;border-inline-start:4px solid var(--pr)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:8px 0}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
.row>label:has(input[type=checkbox]),.row>label:has(input[type=radio]){flex-direction:row;align-items:center;font-size:15px;color:var(--tx)}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;min-height:38px;max-width:100%}
input[type=checkbox],input[type=radio]{min-height:0;width:18px;height:18px}
button{cursor:pointer;background:var(--card);font-weight:600}
button.pr{background:var(--pr);color:var(--pt);border-color:var(--pr)}
button.bad{color:var(--bad);border-color:var(--bad)}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad)}
.kv{display:flex;justify-content:space-between;padding:2px 0}
.big{font-size:20px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:start;white-space:nowrap}
#box{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
#box .card{width:100%;max-width:560px}
textarea{width:100%;height:200px;font:12px monospace}
@media print{header,button,#box{display:none!important}body{background:#fff;color:#000}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{border-radius:999px;padding:6px 14px}.chip.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.th{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer}.thw{position:relative;display:inline-block}.thw button{position:absolute;top:-6px;inset-inline-end:-6px;min-height:0;padding:0 6px;border-radius:999px}
input.num{direction:ltr;text-align:start}
.dtf{display:flex;gap:6px;align-items:center}.dtf input{min-width:0;flex:1}.jd{cursor:pointer;text-align:center;direction:ltr}.pkg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin:8px 0}.pkg button{min-height:38px;padding:0}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.mc{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0;min-height:70px;border-radius:10px;position:relative}.mc.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}.mc.td{background:rgba(76,192,192,.18)}.mc.ev{border-color:var(--pr);border-width:2px}.mc small{font-size:10px;color:var(--mu);line-height:1;white-space:nowrap}.tdot{width:6px;height:6px;border-radius:50%;background:var(--pr);display:inline-block}.tb{display:inline-flex;gap:3px;vertical-align:middle}.tb i{width:14px;height:8px;border-radius:3px;display:inline-block}.ht td,.ht th{text-align:center;padding:3px 4px;white-space:nowrap}.ht tr[data-act]{cursor:pointer}.big{font-size:17px;margin-bottom:4px}
</style></head><body>

const LN={fa:'فارسی',en:'English',ar:'العربية',tr:'Türkçe'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9),n=v=>parseFloat(v)||0,K='oceanledger.v1';
const DC=()=>[{n:'ماچله',u:'پلاستیک'},{n:'جیم',u:'کیلو'},{n:'بنزین',u:'چلیکه'},{n:'روغن',u:'بطری'},{n:'یخ',u:'گونی'},{n:'دیگر',u:''}];
const DB=()=>({id:'b1',name:'قایق ۱',port:'',owner:'',op:50,cs:1,bs:1});
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{v:2,set:{lang:'fa',theme:'light',cur:'تومان',cats:DC()},boats:[DB()],crew:[],trips:[],draft:null,edit:false};
S.debts=S.debts||[];S.set.cal=S.set.cal||'j';
if(S.v!==2){S.v=2;S.set.lang='fa';S.set.theme='light';S.set.cur='تومان';S.set.cats=DC();S.boats.forEach(b=>{b.bs=1;delete b.bonus;if(b.name==='Boat 1')b.name='قایق ۱'});S.trips.forEach(x=>{x.fish=x.inc?[{id:uid(),type:'ماهی',kg:1,price:n(x.inc)}]:[];delete x.inc;x.bonus=1});S.draft=null;S.edit=false}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const t=k=>(L[S.set.lang]||L.fa)[k]||L.fa[k]||k;
const fmt=v=>{v=+v||0;if(Math.abs(v)<.005)v=0;const c=S.set.cur;try{if(/^[A-Za-z]{3}$/.test(c))return '\u200E'+new Intl.NumberFormat('en-US',{style:'currency',currency:c.toUpperCase()}).format(v);return '\u200E'+new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(v)+' '+c}catch(e){return Math.round(v)+' '+c}};
const bname=id=>(S.boats.find(b=>b.id===id)||{name:'?'}).name;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let view='trips',draft=S.draft||null,armed='',flt={from:'',to:''},rp='';
let df=null,sf={},sopen='',dflt='open';let rpT=0;
const fishTot=x=>(x.fish||[]).reduce((a,f)=>a+n(f.kg)*n(f.price),0);
const catNames=d=>[...new Set([...S.set.cats.map(c=>c.n),...d.ex.map(e=>e.cat)])];
const mkEx=c=>({id:uid(),cat:c,qty:'',unit:(S.set.cats.find(x=>x.n===c)||{u:''}).u,price:'',total:'',note:'',man:false});

function calc(x){const inc=fishTot(x),exp=x.ex.reduce((a,e)=>a+n(e.total),0),net=inc-exp,sh=x.mem.reduce((a,m)=>a+n(m.share),0),pool=net*(1-n(x.op)/100),u=sh?pool/sh:0,bon=x.mem.some(m=>m.cap)?n(x.bonus)*u:0,own=net*n(x.op)/100-bon;
 const cr=x.cr||[],xp=x.xp||[],sm=(a,f)=>a.reduce((s,q)=>s+n(q.amt),0);
 const p=x.mem.map(m=>{const earned=n(m.share)*u+(m.cap?bon:0),my=x.pays.filter(q=>q.id===m.id),ded=sm(my.filter(q=>q.debt)),paid=sm(my.filter(q=>!q.debt)),rec=sm(cr.filter(q=>q.lid===m.id));return{...m,earned,ded,rec,paid,net:earned+rec-ded,bal:earned+rec-ded-paid}});
 const ids=new Set(x.mem.map(m=>m.id)),ex={};cr.filter(q=>q.lid!=='own'&&!ids.has(q.lid)).forEach(q=>{const e=ex[q.lid]=ex[q.lid]||{lid:q.lid,name:q.ln,rec:0,paid:0,cr:[]};e.rec+=n(q.amt);e.cr.push(q)});
 xp.forEach(q=>{if(ex[q.lid])ex[q.lid].paid+=n(q.amt)});
 const xs=Object.values(ex).map(e=>({...e,bal:e.rec-e.paid})),ownRec=sm(cr.filter(q=>q.lid==='own'));
 return{inc,exp,net,own,pool,p,xs,ownRec}}

/* ===== numbers: thousands separators (1,000,000) ===== */
const nz=s=>String(s??'').replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/٫/g,'.').replace(/[٬،]/g,',');
const gp=s=>{s=nz(s).replace(/[^\d.]/g,'');const i=s.indexOf('.');let a=i<0?s:s.slice(0,i),b=i<0?'':'.'+s.slice(i+1).replace(/\./g,'');a=a.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,',');return a+b};
const pn=s=>n(gp(s).replace(/,/g,''));
function fixNum(el){const p=el.selectionStart==null?el.value.length:el.selectionStart,L=el.value.slice(0,p).replace(/[^\d.٠-٩۰-۹٫]/g,'').length,f=gp(el.value);if(f===el.value)return;el.value=f;let c=0,i=0;while(i<f.length&&c<L){if(f[i]!==',')c++;i++}try{el.setSelectionRange(i,i)}catch(e){}}

/* ===== proof images: stored in IndexedDB (not localStorage), shrunk first ===== */
const IMG={};
const idb=new Promise(r=>{try{const q=indexedDB.open('oceanledger-proofs',1);q.onupgradeneeded=()=>q.result.createObjectStore('p');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idbPut=(k,v)=>idb.then(d=>d?new Promise(r=>{const x=d.transaction('p','readwrite');x.objectStore('p').put(v,k);x.oncomplete=()=>r(1);x.onerror=()=>r(0)}):0);
const idbDel=k=>idb.then(d=>{if(d)d.transaction('p','readwrite').objectStore('p').delete(k)});
const idbAll=()=>idb.then(d=>d?new Promise(r=>{const o={},q=d.transaction('p').objectStore('p').openCursor();q.onsuccess=()=>{const c=q.result;if(c){o[c.key]=c.value;c.continue()}else r(o)};q.onerror=()=>r(o)}):{});
const shrink=f=>new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas'),x=c.getContext('2d');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};i.onerror=rej;i.src=u});
async function addImgs(sc,did,files){const tg=sc==='df'?df:sf[did];if(!tg)return;for(const f of files){try{const u=await shrink(f),id=uid()+uid();IMG[id]=u;await idbPut(id,u);tg.im.push(id)}catch(e){}}render()}

/* ===== debts ===== */
const tp=(k,o)=>t(k).replace(/\{(\w+)\}/g,(_,x)=>esc(o[x]??''));
const nowLocal=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const fmtAt=s=>cdt(s);
const dRem=g=>g.amt-g.log.reduce((a,l)=>a+n(l.amt),0);
const owedBy=id=>S.debts.filter(g=>g.who===id).reduce((a,g)=>a+Math.max(0,dRem(g)),0);
const newDf=()=>({who:S.crew[0]?S.crew[0].id:'',to:'',role:'captain',amt:'',at:nowLocal(),why:'',tx:'',im:[]});
const sfNew=()=>({k:'other',amt:'',at:nowLocal(),why:'',tx:'',im:[]});
const roleName=r=>({captain:t('captain'),owner:t('owner'),broker:t('rBroker')}[r]||t('rOther'));
const logText=(g,l)=>l.k==='deduct'?tp('tplDed',{d:cd(l.td),l:g.to,a:fmtAt(g.at),w:g.why}):l.k==='rev'?tp('tplRev',{d:cd(l.td)}):`${t('k_'+l.k)}${l.why?': '+esc(l.why):''}`;
const payTxt=q=>{if(!q.debt)return'';const g=S.debts.find(x=>x.id===q.debt);return ' — ↳ '+tp('payDed',{l:q.to,w:g?g.why:''})};
const revDebts=d=>S.debts.forEach(g=>g.log.filter(l=>l.k==='deduct'&&l.trip===d.id&&!l.rv).forEach(l=>{l.rv=1;g.log.push({id:uid(),k:'rev',amt:-l.amt,at:nowLocal(),trip:d.id,td:d.date})}));
const dBadge=id=>{if(!S.debts.some(g=>g.who===id))return'';const o=owedBy(id);return `<span class="${o>.005?'bad':'ok'}">${t('debts')}: ${o>.005?fmt(-o):'0 ✓'}</span>`};
const dcsv=()=>{const D=[[t('debtor'),t('lender'),t('role'),t('when'),t('payAmt'),t('remain'),t('reason')]],G=[[t('debtor'),t('lender'),t('when'),t('kind'),t('payAmt'),t('reason')]];S.debts.forEach(g=>{D.push([g.wn,g.to,g.role,cdt(g.at),g.amt,Math.round(dRem(g)),g.why]);g.log.forEach(l=>G.push([g.wn,g.to,cdt(l.at),l.k,l.amt,l.k==='deduct'?'trip '+cd(l.td):(l.why||'')]))});const R=[[t('date'),t('debtor'),t('lender'),t('payAmt'),t('reason')]];S.trips.forEach(x=>(x.cr||[]).forEach(q=>{const g=S.debts.find(z=>z.id===q.debt);R.push([cd(x.date),q.from,q.ln,n(q.amt),g?g.why:''])}));return[D,G,R]};

const debtBox=p=>{const gs=S.debts.filter(g=>g.who===p.id&&dRem(g)>.005);if(!gs.length)return'';
